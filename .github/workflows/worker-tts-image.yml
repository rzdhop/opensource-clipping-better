name: worker-comfyui-tts image

# Builds docker/worker-comfyui-tts (the RunPod serverless ComfyUI worker + Chatterbox
# TTS, plan 31) and pushes it to GHCR. Separate from ci.yml on purpose: it only runs
# when the image's files change, or by hand.
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "runpod/worker-comfyui base tag"
        required: false
        default: "5.10.0-base-cuda12.8.1"
  push:
    branches: [main]   # :latest only from main; any branch by hand (workflow_dispatch)
    paths:
      - "docker/worker-comfyui-tts/**"
      - ".github/workflows/worker-tts-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Pinned, not -latest (same as ci.yml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The base image is ~11 GB: free the runner's preinstalled toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No GHA layer cache: the layers are far over its 10 GB limit.
      - uses: docker/build-push-action@v6
        with:
          context: docker/worker-comfyui-tts
          push: true
          tags: |
            ghcr.io/rzdhop/worker-comfyui-tts:${{ github.sha }}
            ghcr.io/rzdhop/worker-comfyui-tts:latest
          build-args: |
            BASE_TAG=${{ inputs.base_tag || '5.10.0-base-cuda12.8.1' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
