name: fruitstory-worker image

# Builds fruitstory/worker (the LTX speech worker of plan 36, FROM worker-comfyui-tts) and
# pushes it to GHCR. Separate from worker-tts-image.yml: it only runs when its own files change,
# or by hand.
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "ghcr.io/rzdhop/worker-comfyui-tts tag"
        required: false
        default: "latest"
  push:
    branches: [main]
    paths:
      - "fruitstory/worker/**"
      - ".github/workflows/fruitstory-worker-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The base image is ~11 GB: free the runner's preinstalled toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: fruitstory/worker
          file: fruitstory/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/rzdhop/fruitstory-worker:0.1.0
            ghcr.io/rzdhop/fruitstory-worker:${{ github.sha }}
          build-args: |
            BASE_TAG=${{ inputs.base_tag || 'latest' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
