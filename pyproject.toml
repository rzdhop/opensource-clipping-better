[project]
name = "rzdhop-clips"
version = "3.0.0"
description = "Turn long videos into vertical short-form clips, using free hosted AI endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]",  # asset fetching only: studio/effects.py, studio/transitions.py, youtube_tracker
    "faster-whisper",
    "tqdm",  # the transcription progress bar: clipping/engine.py
    "google-genai",
    "openai>=2.24.0,<3",  # OpenAI-compatible client for every provider in clipping/providers/
    "mediapipe",
    "opencv-python",
    "Pillow",
    "requests>=2.33.0,<3",
    "python-dotenv",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "ultralytics",
    "gdown",
]

[project.scripts]
rzclips = "main:main"
# Kept so an existing install keeps working.
clipping = "main:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
