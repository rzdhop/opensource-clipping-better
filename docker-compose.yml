services:
  backend:
    build: .
    container_name: rzc-backend
    # The bind mounts below replace the image's own directories, which throws
    # away the Dockerfile's build-time `chown appuser`. What the container sees
    # is the HOST's ownership, so it has to run as the host user that owns
    # ./uploads and ./outputs -- otherwise every upload fails with EACCES.
    # Override in .env when your uid is not 1000: DOCKER_UID=$(id -u).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      # Bound to loopback, not 0.0.0.0. This host has a public IP, and the API
      # was reachable from the internet with no authentication at all. Reach it
      # over the tailnet with:
      #   tailscale serve --bg --https=443 http://127.0.0.1:8000
      # See docs/deploy-tailscale.md.
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      # The bind mount above replaces /app wholesale, which would hide the
      # dashboard the Dockerfile built into the image behind the host's
      # (gitignored, usually absent) directory -- and the API would fall back to
      # its "dashboard not built" JSON. This anonymous volume keeps the image's
      # copy visible, the same trick __pycache__ uses on the line above.
      - /app/web/dashboard/dist
      - ./outputs:/app/outputs
      - ./uploads:/app/uploads
      - ./custom_fonts:/app/custom_fonts
      # Settings entered in the dashboard (API keys) live here. Without this
      # mount they are lost on every `docker compose up --build`.
      - ./data:/app/data
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:-}
      - OPENAI_COMPAT_MODEL=${OPENAI_COMPAT_MODEL:-}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
      - MAX_QUEUED_JOBS=${MAX_QUEUED_JOBS:-20}
      # `user:` above may be a uid with no /etc/passwd entry, which leaves HOME
      # unset and makes libraries that cache under it fall over.
      - HOME=/tmp
      # Pin the API token here to keep it stable across rebuilds. Left unset,
      # the backend generates one on first start and prints it.
      - API_TOKEN=${API_TOKEN:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - LLM_CHAIN=${LLM_CHAIN:-}
      - STT_CHAIN=${STT_CHAIN:-}
      # The chain's "custom" link. .env.example has documented these since the
      # provider layer landed, but they were never passed into the container, so
      # a chain naming custom/<model> failed with "the 'custom' provider needs
      # LLM_CUSTOM_BASE_URL set" no matter what the host .env said.
      - LLM_CUSTOM_BASE_URL=${LLM_CUSTOM_BASE_URL:-}
      - LLM_CUSTOM_API_KEY=${LLM_CUSTOM_API_KEY:-}
      # Server-side downloading. On by default and best-effort: sites refuse
      # datacenter IPs often, and a refusal parks the job in `needs_upload`
      # rather than failing it. Set to 0 to stop trying entirely.
      - ENABLE_SERVER_FETCH=${ENABLE_SERVER_FETCH:-1}
      - POT_PROVIDER_URL=${POT_PROVIDER_URL:-}
    restart: unless-stopped
    # Uncomment below for GPU support (requires NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Only started with `--profile pot`. Supplies proof-of-origin tokens to
  # yt-dlp, which its own authors describe as something that "may help your
  # traffic seem more legitimate" -- NOT a bypass. Worth trying if server-side
  # downloads fail often; the reliable answer is still tools/rzclips-fetch.py
  # on a machine with a home connection.
  #
  #   docker compose --profile pot up -d
  #   # then set POT_PROVIDER_URL=http://bgutil:4416 in .env
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: rzc-bgutil
    profiles: ["pot"]
    ports:
      - "127.0.0.1:4416:4416"
    restart: unless-stopped

  # Only started with `--profile domain`, for serving on your own domain.
  # Tailscale needs none of this; see docs/deploy-tailscale.md.
  caddy:
    image: caddy:2-alpine
    container_name: rzc-caddy
    profiles: ["domain"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
